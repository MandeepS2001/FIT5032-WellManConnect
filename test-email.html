<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Service Test</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #0056b3; }
        input { padding: 8px; margin: 5px; width: 250px; }
        .log { background: #f8f9fa; padding: 10px; border-radius: 3px; font-family: monospace; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>📧 Email Service Test</h1>
    <p>Test the alternative email services to verify they work before implementing in the main app.</p>

    <div class="test-section">
        <h3>🧪 Test Formspree Email</h3>
        <input type="email" id="formspree-email" placeholder="Enter your email address" value="dangmandeep2001@gmail.com">
        <br>
        <button onclick="testFormspree()">Test Formspree Email</button>
        <div id="formspree-result"></div>
    </div>

    <div class="test-section">
        <h3>📋 Test Results Log</h3>
        <div id="test-log" class="log"></div>
        <button onclick="clearLog()">Clear Log</button>
    </div>

    <script>
        function log(message) {
            const logDiv = document.getElementById('test-log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.textContent += `[${timestamp}] ${message}\n`;
        }

        function clearLog() {
            document.getElementById('test-log').textContent = '';
        }

        async function testFormspree() {
            const email = document.getElementById('formspree-email').value;
            const resultDiv = document.getElementById('formspree-result');
            
            if (!email) {
                resultDiv.innerHTML = '<div class="error">Please enter an email address</div>';
                return;
            }

            log('🧪 Testing Formspree email service...');
            log(`📧 Sending email to: ${email}`);

            try {
                const formData = new FormData();
                formData.append('email', email);
                formData.append('subject', 'Test Email from WellMan Connect');
                formData.append('message', 'This is a test email to verify the email service is working correctly. If you receive this, the email functionality is working!');
                formData.append('_replyto', 'mdan0028@student.monash.edu');
                formData.append('_subject', 'WellMan Connect: Test Email');

                const response = await fetch('https://formspree.io/f/mkgqakbn', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Formspree error: ${response.status}`);
                }

                const result = await response.json();
                log('✅ Formspree email sent successfully!');
                log(`📧 Response: ${JSON.stringify(result)}`);
                
                resultDiv.innerHTML = '<div class="success">✅ Email sent successfully! Check your inbox.</div>';
                
            } catch (error) {
                log(`❌ Formspree test failed: ${error.message}`);
                resultDiv.innerHTML = `<div class="error">❌ Test failed: ${error.message}</div>`;
            }
        }

        // Initialize
        log('📧 Email Service Test Page Loaded');
        log('💡 Enter your email and click "Test Formspree Email" to verify the service works');
    </script>
</body>
</html>
